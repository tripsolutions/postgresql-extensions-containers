name: Build and Push

on:
  workflow_dispatch:
    inputs:
      ext_name:
        description: 'Extension name'
        required: true
        type: choice
        options:
          - cron
          - timescale
      pg_major:
        description: 'PostgreSQL major version'
        required: true
        type: string
        default: '18'
      ext_version:
        description: 'Extension version'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/postgresql-ext-${{ inputs.ext_name || 'extension' }}
          tags: |
            type=raw,value=${{ inputs.pg_major }}-${{ inputs.ext_version }}
            type=raw,value=${{ inputs.pg_major }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ inputs.ext_name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PG_MAJOR=${{ inputs.pg_major }}
            EXT_VERSION=${{ inputs.ext_version }}
